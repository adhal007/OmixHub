# OmixHub Environment
# ===================
# Conda environment for OmixHub: ML for Omics Data
#
# Installation:
#   conda env create -f environment.yml
#   conda activate omixhub
#
# Update existing:
#   conda env update -f environment.yml --prune

name: omixhub

channels:
  - pytorch
  - conda-forge
  - defaults

dependencies:
  # ===================
  # Core Python
  # ===================
  - python>=3.10,<3.12
  - pip>=23.0
  
  # ===================
  # Scientific Computing
  # ===================
  - numpy>=1.24,<2.0
  - scipy>=1.11
  - pandas>=2.0
  - scikit-learn>=1.3
  - statsmodels>=0.14
  
  # ===================
  # Deep Learning
  # ===================
  - pytorch>=2.0
  - torchvision>=0.15
  
  # ===================
  # Bioinformatics
  # ===================
  - scanpy>=1.9
  - anndata>=0.10
  - h5py>=3.10
  
  # ===================
  # Visualization
  # ===================
  - matplotlib>=3.8
  - seaborn>=0.12
  
  # ===================
  # ML Tools
  # ===================
  - shap>=0.43
  - umap-learn>=0.5
  - hdbscan>=0.8
  - imbalanced-learn>=0.11
  - numba>=0.57
  - hyperopt>=0.2
  
  # ===================
  # Jupyter & Dev
  # ===================
  - jupyter
  - ipykernel>=6.26
  - ipython>=8.16
  - tqdm>=4.66
  
  # ===================
  # Utilities
  # ===================
  - requests>=2.31
  - beautifulsoup4>=4.12
  - pyyaml>=6.0
  - cloudpickle>=3.0
  
  # ===================
  # Pip-only packages
  # ===================
  - pip:
      # GDC API
      - gdc-api-wrapper>=0.2
      - grequests>=0.7.0
      
      # Differential Expression
      - pydeseq2>=0.4
      
      # Single-cell (CellxGene)
      - cellxgene-census>=1.0
      
      # Google Cloud (optional - for BigQuery)
      - google-cloud-bigquery>=3.25
      
      # MongoDB (optional)
      - pymongo>=4.7
      
      # Data processing
      - flatten-json>=0.1
      - natsort>=8.4
      
      # Visualization
      - altair>=5.0
      
      # Streamlit app (optional)
      - streamlit>=1.36
      
      # Git integration
      - gitpython>=3.1

# ===================
# Notes
# ===================
# 
# Optional GPU support:
#   For CUDA, install pytorch with: conda install pytorch pytorch-cuda=12.1 -c pytorch -c nvidia
#
# Minimal install (no optional):
#   Remove: google-cloud-bigquery, pymongo, streamlit, cellxgene-census
#
# Apple Silicon (M1/M2):
#   pytorch should auto-detect and use MPS backend
